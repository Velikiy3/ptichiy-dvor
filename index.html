<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Птичий Двор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen farm — egg counter header, scrollable views (yard grid, birds+incubator, quests, farm), bottom tab bar.
   Deliberately single-theme: a bright cartoon farmyard with thick ink outlines, same on any host. */
:root{
  color-scheme:light;
  --sky:#8fd0f0; --hill:#7cc75a; --hill2:#5fae45; --plank:#f4d9a6; --plank-d:#d9b37a;
  --ink:#2b1d14; --paper:#fff8ea; --accent:#ff6b2c; --gold:#ffc83a; --muted:#7a6250;
  --rare:#2f8fe0; --epic:#8a4fe0; --good:#3f9a3a;
  --f-display:"Rubik","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;
  background:
   radial-gradient(120% 40% at 20% 100%,var(--hill2) 60%,transparent 61%),
   radial-gradient(110% 38% at 85% 100%,var(--hill) 60%,transparent 61%),
   linear-gradient(var(--sky),#c8ecff);}
.clouds{position:absolute;inset:0 0 auto;height:140px;pointer-events:none;overflow:hidden}
.cloud{position:absolute;width:90px;height:30px;background:#fff;border-radius:30px;opacity:.9;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:40px;height:40px;left:14px;top:-18px}.cloud::after{width:30px;height:30px;left:46px;top:-12px}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(620px)}}
header{position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 6px;display:flex;align-items:center;gap:10px}
.counter{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:6px 14px;box-shadow:0 4px 0 var(--ink)}
.counter svg{width:30px;height:36px;flex:none}
.counter .num{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,7vw,32px);font-variant-numeric:tabular-nums;line-height:1}
.counter .rate{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.boost-pill{display:inline-block;margin-left:6px;background:var(--accent);color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
.icon-btn{width:46px;height:46px;flex:none;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--ink);font-size:20px;cursor:pointer}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.view{position:relative;flex:1;min-height:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
.view[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.nest{position:relative;background:var(--plank);border:3px solid var(--ink);border-radius:18px;padding:6px 6px 8px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0;font:inherit;color:inherit}
.nest:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.nest *{pointer-events:none}
.nest,.buy,.tabs button,.big-btn,.stork,.icon-btn{touch-action:manipulation}
.stork *{pointer-events:none}
.nest .art{width:100%;aspect-ratio:1/0.95;max-width:100%;position:relative}
.nest svg.bird{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:50% 85%}
.nest.squash svg.bird{animation:squash .28s ease-out}
@keyframes squash{30%{transform:scale(1.15,.82)}60%{transform:scale(.92,1.1)}100%{transform:none}}
.nest .name{font-family:var(--f-display);font-weight:700;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nest.r-rare{background:#d6ecff}.nest.r-epic{background:#e6d8ff}
.prog{width:88%;height:9px;border:2px solid var(--ink);border-radius:9px;background:var(--paper);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.nest.full .prog i{background:var(--gold)}
.nest.full::after{content:"Собрать!";position:absolute;top:-10px;left:50%;transform:translateX(-50%);font:800 11px var(--f-body);background:var(--gold);border:2px solid var(--ink);border-radius:10px;padding:1px 7px;white-space:nowrap;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-3px)}}
.empty{background:transparent;border-style:dashed;box-shadow:none;justify-content:center;min-height:120px;color:var(--ink);font-weight:800;font-size:13px;text-align:center;gap:4px}
.empty b{font-size:26px;line-height:1}
.locked-slot{opacity:.55}
.big-btn{margin:14px auto 0;display:block;font:900 16px var(--f-display);background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 22px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.big-btn:disabled{opacity:.5;transform:none;box-shadow:0 5px 0 var(--ink);cursor:default}
h2{font-family:var(--f-display);font-weight:900;font-size:22px;margin:14px 0 10px;text-shadow:0 2px 0 var(--paper)}
h2:first-child{margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
.card .pic{width:58px;height:56px;flex:none}
.card .pic svg{width:100%;height:100%;overflow:visible}
.card .txt{flex:1;min-width:0}
.card b{display:block;font-family:var(--f-display);font-weight:700;font-size:16px}
.card small{display:block;color:var(--muted);font-weight:700;font-size:12px;line-height:1.35}
.card.done{opacity:.55}
.qbar{height:8px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;background:var(--good)}
.buy{font:900 14px var(--f-display);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:4px}
.buy svg{width:14px;height:17px}
.buy.green{background:var(--good)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.buy:disabled{background:#c9b9a6;cursor:default;transform:none;box-shadow:0 3px 0 var(--ink)}
.buy:focus-visible,.tabs button:focus-visible,.icon-btn:focus-visible,.big-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.silhouette{filter:brightness(0) opacity(.35)}
.tag{display:inline-block;font:800 10px var(--f-body);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px;text-transform:uppercase;letter-spacing:.05em}
.tag.rare{background:var(--rare)}.tag.epic{background:var(--epic)}
/* incubator */
.incub{display:flex;gap:14px;align-items:center;background:linear-gradient(#fff3d6,#ffe1a8);border:3px solid var(--ink);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--ink)}
.incub .egg{width:72px;height:84px;flex:none;position:relative}
.incub .egg svg{width:100%;height:100%;overflow:visible}
.incub.busy .egg svg{animation:wobble 1.2s ease-in-out infinite;transform-origin:50% 90%}
.incub.ready .egg svg{animation:wobble .4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.incub .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.incub b{font-family:var(--f-display);font-size:17px}
.incub small{font-size:12px;font-weight:700;color:var(--muted);line-height:1.35}
.daily-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:8px}
.day{border:2px solid var(--ink);border-radius:10px;background:#fff;text-align:center;padding:4px 0;font:800 10px var(--f-body);font-variant-numeric:tabular-nums}
.day b{display:block;font:900 12px var(--f-display)}
.day.got{background:var(--good);color:#fff}
.day.now{background:var(--gold);animation:bob2 1s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-3px)}}
.note{font-size:12px;font-weight:700;color:var(--ink);opacity:.75;line-height:1.5;margin:14px 2px 0}
.reset{font:800 12px var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;margin-top:10px}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--plank-d);border-top:3px solid var(--ink);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs button{position:relative;font:800 12px var(--f-body);color:var(--ink);background:var(--plank);border:3px solid var(--ink);border-radius:14px;padding:9px 2px;cursor:pointer;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.badge{position:absolute;top:-9px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#e8382c;color:#fff;border:2px solid var(--ink);font:900 11px/16px var(--f-display);text-align:center;padding:0 4px;box-sizing:border-box}
.fx{position:fixed;pointer-events:none;z-index:20;font:900 20px var(--f-display);color:var(--ink);text-shadow:0 2px 0 var(--paper),0 -1px 0 var(--paper);animation:rise .9s ease-out forwards;white-space:nowrap}
.fx.gold{color:#b36b00}
@keyframes rise{to{transform:translateY(-70px) scale(1.15);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-weight:800;font-size:14px;padding:10px 16px;border-radius:14px;z-index:30;max-width:90%;text-align:center}
/* modal */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#2b1d1499;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{width:100%;max-width:380px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:18px;text-align:center;animation:popin .3s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.sheet h3{font:900 24px var(--f-display);margin:0 0 4px}
.sheet p{margin:4px 0 0;font-weight:700;color:var(--muted);font-size:14px}
.sheet .hero{width:150px;height:140px;margin:6px auto 0}
.sheet .hero svg{width:100%;height:100%;overflow:visible}
.rays{background:repeating-conic-gradient(#ffc83a55 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite}
.rays>svg{animation:counter 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes counter{to{transform:rotate(-360deg)}}
/* life */
.nest svg.bird{animation:idle 2.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-2px) scale(1.02,.98)}}
.nest .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:none}96%{transform:scaleY(.1)}}
.nest .art.laid>svg:last-child ellipse:nth-last-child(2){transform-box:fill-box;transform-origin:center bottom;animation:laid .35s cubic-bezier(.3,1.8,.6,1)}
@keyframes laid{from{transform:translateY(-14px) scale(.6)}}
.eggcount{position:absolute;right:2px;bottom:2px;background:var(--ink);color:var(--paper);font:900 11px var(--f-display);border-radius:8px;padding:1px 5px}
.counter.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.06)}}
.fly{position:fixed;z-index:25;width:20px;height:24px;pointer-events:none}
.tip{position:relative;margin-bottom:12px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 12px 10px 44px;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--ink);line-height:1.35}
.tip::before{content:"💡";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:20px}
.stork{position:absolute;top:58px;left:-110px;width:96px;height:70px;z-index:15;border:0;background:none;padding:0;cursor:pointer;animation:fly 9s linear forwards}
.stork svg{width:100%;height:100%;overflow:visible;animation:flap .5s ease-in-out infinite}
@keyframes fly{to{transform:translateX(calc(min(100vw,520px) + 220px)) translateY(10px)}}
@keyframes flap{50%{transform:translateY(-4px)}}
.glory{color:#9a5a00}
@media (prefers-reduced-motion:reduce){.nest svg.bird,.nest .eye,.stork svg{animation:none!important}.stork{animation-duration:14s}}
@media (prefers-reduced-motion:reduce){.cloud,.nest.full::after,.day.now,.incub .egg svg,.rays,.rays>svg{animation:none!important}.nest.squash svg.bird{animation:none}.fx{animation-duration:.01s}.sheet{animation:none}}
</style>
</head>
<body>


<div class="app">
  <div class="clouds"><div class="cloud" style="top:40px"></div><div class="cloud" style="top:90px;animation-delay:-18s;animation-duration:55s"></div></div>
  <header>
    <div class="counter" id="counter">
      <svg viewBox="0 0 30 36" aria-hidden="true"><ellipse cx="15" cy="20" rx="12" ry="15" fill="#fff8ea" stroke="#2b1d14" stroke-width="3"/><ellipse cx="10" cy="14" rx="3" ry="5" fill="#fff" opacity=".9"/></svg>
      <div><div class="num" id="eggs">0</div><div class="rate"><span id="rate">0 яиц/мин</span><span id="boostPill"></span></div></div>
    </div>
    <button class="icon-btn" id="sound" aria-label="Звук">🔈</button>
  </header>

  <section class="view" id="v-yard">
    <div class="tip" id="tip" hidden></div>
    <div class="grid" id="grid"></div>
    <button class="big-btn" id="collectAll">Собрать все яйца</button>
  </section>

  <section class="view" id="v-birds" hidden>
    <h2>Инкубатор</h2>
    <div id="incub"></div>
    <h2>Купить птиц</h2>
    <div class="list" id="shop"></div>
    <h2>Редкие птицы</h2>
    <div class="list" id="rares"></div>
  </section>

  <section class="view" id="v-quests" hidden>
    <h2>Награда дня</h2>
    <div id="dailyCard"></div>
    <h2>Задания</h2>
    <div class="list" id="quests"></div>
  </section>

  <section class="view" id="v-up" hidden>
    <h2>Хозяйство</h2>
    <div class="list" id="ups"></div>
    <p class="note">Яйца — очки внутри игры. Их нельзя купить за деньги или вывести.</p>
    <button class="reset" id="reset">Начать заново</button>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="v-yard" id="t-yard">Двор</button>
    <button role="tab" aria-selected="false" data-v="v-birds" id="t-birds">Птицы<span class="badge" id="b-birds" hidden>!</span></button>
    <button role="tab" aria-selected="false" data-v="v-quests" id="t-quests">Задания<span class="badge" id="b-quests" hidden>0</span></button>
    <button role="tab" aria-selected="false" data-v="v-up" id="t-up">Хозяйство</button>
  </nav>
</div>
<div id="modalRoot"></div>

<script>
// ---------- data ----------
const TYPES=[
 {id:"hen",   name:"Курица",    cost:15,      time:5,  value:1,    body:"#ffffff", wing:"#e9e2d6", belly:"#ffffff", beak:"#ffb11b", egg:"#fff3e0", top:"comb", topC:"#e8382c"},
 {id:"duck",  name:"Утка",      cost:120,     time:8,  value:4,    body:"#f9d84a", wing:"#e9b92a", belly:"#ffe98a", beak:"#ff8a1b", egg:"#e8f4ea", top:"tuft", topC:"#e9b92a", bill:true},
 {id:"goose", name:"Гусь",      cost:900,     time:12, value:15,   body:"#dfe6ea", wing:"#a9b6be", belly:"#f4f7f8", beak:"#ff7a1b", egg:"#fffaf0", top:"none", bill:true, neck:true},
 {id:"turkey",name:"Индюк",     cost:6000,    time:18, value:50,   body:"#7a4a2a", wing:"#5a3418", belly:"#9a6440", beak:"#f2b33a", egg:"#f2dcc0", top:"wattle", topC:"#e8382c", tail:["#5a3418","#c9853b","#f2d29a"]},
 {id:"peacock",name:"Павлин",   cost:40000,   time:25, value:200,  body:"#1f6fd1", wing:"#1a52a0", belly:"#3a8ae8", beak:"#2b1d14", egg:"#e6eef8", top:"crown", topC:"#1f6fd1", tail:["#1f8a6a","#2fc28f","#1f6fd1"]},
 {id:"ostrich",name:"Страус",   cost:250000,  time:40, value:900,  body:"#2f2a28", wing:"#f4f0ea", belly:"#3d3734", beak:"#e8b08a", egg:"#fff6e3", top:"none", neck:true, big:true},
 {id:"fire",  name:"Жар-птица", cost:2000000, time:60, value:5000, body:"#ff8a1f", wing:"#e8382c", belly:"#ffd23a", beak:"#7a2a10", egg:"#ffd23a", top:"flame", topC:"#ffd23a", tail:["#e8382c","#ff8a1f","#ffd23a"]},
 // only from the incubator
 {id:"owl",   name:"Снежная сова",     rare:"rare", time:15, value:70,   body:"#f4f6f8", wing:"#c9d3da", belly:"#ffffff", beak:"#2b1d14", egg:"#eef5ff", top:"ears", topC:"#c9d3da"},
 {id:"parrot",name:"Радужный попугай", rare:"rare", time:20, value:220,  body:"#2fbf5a", wing:"#e8382c", belly:"#ffd23a", beak:"#2b1d14", egg:"#d8ffe2", top:"tuft", topC:"#1f6fd1", tail:["#e8382c","#1f6fd1","#ffd23a"]},
 {id:"cosmo", name:"Космический гусь", rare:"epic", time:30, value:1800, body:"#5b3fc4", wing:"#2a1f6b", belly:"#9b86ff", beak:"#ffd23a", egg:"#c9b8ff", top:"none", neck:true, bill:true}
];
const T=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const SHOP=TYPES.filter(t=>!t.rare), RARES=TYPES.filter(t=>t.rare);
const RLABEL={rare:"Редкая",epic:"Эпическая"};
const MAX_SLOTS=12, HATCH_TIME=20, ODDS={epic:3,rare:12};
const UPS=[
 {id:"feed",  name:"Кормушка",     desc:l=>`Птицы несутся на ${20*l}% быстрее. Следующий уровень: +20%`, cost:l=>Math.floor(100*Math.pow(2.2,l)), max:15},
 {id:"slot",  name:"Новое гнездо", desc:l=>`Гнёзд: ${3+l} из ${MAX_SLOTS}. Больше гнёзд — больше птиц`, cost:l=>Math.floor(60*Math.pow(3,l)), max:MAX_SLOTS-3},
 {id:"basket",name:"Корзинщик",    desc:l=>l?`Сам собирает яйца каждые ${autoEvery(l)} с`:"Нанять помощника, который сам собирает яйца", cost:l=>Math.floor(500*Math.pow(4,l)), max:5},
 {id:"golden",name:"Золотое яйцо", desc:l=>`Шанс ${goldChance(l)}% снести золотое яйцо (×10). Следующий: +2%`, cost:l=>Math.floor(1000*Math.pow(3,l)), max:6},
 {id:"cap",   name:"Большое гнездо",desc:l=>`В гнезде помещается ${3+l} яиц. Полное гнездо перестаёт нестись`, cost:l=>Math.floor(400*Math.pow(5,l)), max:3}
];
const DAILY_MULT=[5,8,12,18,25,35,60];
function autoEvery(l){return [0,10,6,3,1.5,0.5][l]}
function goldChance(l){return 3+2*l}

const fresh=()=>({eggs:10,total:0,nests:[{type:"hen",prog:0,eggs:0}],owned:{hen:1},up:{feed:0,slot:0,basket:0,golden:0,cap:0},
  t:Date.now(),autoT:0,sound:true,boostUntil:0,glory:0,moves:0,lifetime:0,storkT:40,
  stats:{taps:0,bought:0,hatched:0,golden:0,rare:0},quests:{},
  daily:{last:"",streak:0},incub:{state:"idle",left:0,result:null,free:0}});
let S=fresh();

function nestValue(n){const t=T[n.type];let v=0;for(let i=0;i<n.eggs;i++)v+=t.value*((n.gold&&n.gold[i])?10:1);return Math.floor(v*vmult())}
function collect(i,silent){const n=S.nests[i];if(!n||!n.eggs)return 0;const v=nestValue(n),cnt=n.eggs,gc=(n.gold||[]).slice(0,n.eggs).filter(Boolean).length;n.eggs=0;n.gold=[];earn(v);S.stats.golden+=gc;if(!silent){try{fxAt(i,"+"+fmt(v),gc>0);flyEggs(i,Math.min(cnt,4),gc>0)}catch(e){}pop(gc?880:620)}return v}
function tick(dt){
  S.nests.forEach(n=>{if(n.eggs>=eggCap()){n.prog=0;return}n.prog+=dt*speed()/T[n.type].time;while(n.prog>=1&&n.eggs<eggCap()){n.prog-=1;layEgg(n)}if(n.eggs>=eggCap())n.prog=0});
  if(S.up.basket){S.autoT+=dt;const every=autoEvery(S.up.basket);if(S.autoT>=every){S.autoT=0;S.nests.forEach((n,i)=>{if(n.eggs)collect(i,true)})}}
  if(S.incub.state==="busy"){S.incub.left-=dt;if(S.incub.left<=0){S.incub.left=0;S.incub.state="ready"}}
}
// place a bird: free slot, else replace the weakest if the new one is better
function placeBird(id){
  const nb={type:id,prog:0,eggs:0};
  if(S.nests.length<slots()){S.nests.push(nb);return"new"}
  let w=0;S.nests.forEach((n,i)=>{if(rate(T[n.type])<rate(T[S.nests[w].type]))w=i});
  if(rate(T[id])<=rate(T[S.nests[w].type]))return"kept";
  collect(w,true);const old=S.nests[w].type;S.owned[old]=Math.max(0,(S.owned[old]||1)-1);S.nests[w]=nb;return"replaced:"+T[old].name;
}

 <path d="M52 30 q10-6 14-14" stroke="#2b1d14" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M52 30 q10-6 14-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
 <circle cx="68" cy="14" r="7" fill="#fff" stroke="#2b1d14" stroke-width="3"/><circle cx="70" cy="12" r="2" fill="#2b1d14"/>

 <path d="M28 28 q10-22 26-20 q-6 14-14 22z" fill="#fff" stroke="#2b1d14" stroke-width="3" stroke-linejoin="round"/><path d="M44 10 q8-2 10-2 q-2 6-4 8z" fill="#2b1d14"/></svg>`}
function spawnStork(){if(document.querySelector(".stork"))return;const b=document.createElement("button");b.className="stork";b.setAttribute("aria-label","Аист с посылкой — нажмите, чтобы забрать");b.innerHTML=storkSVG();
  b.addEventListener("animationend",e=>{if(e.target===b)b.remove()});
  b.addEventListener("click",()=>{b.remove();const r=Math.random();
    if(r<.6){const v=Math.floor(baseMin()*2);earn(v);toast(`Аист принёс ${fmt(v)} яиц!`)}
    else if(r<.85){S.boostUntil=Math.max(S.boostUntil,now())+2*60000;toast("Аист принёс ускорение ×2 на 2 минуты!")}
    else{S.incub.free++;toast("Аист принёс бесплатное яйцо для инкубатора!")}
    fanfare();renderTop();refreshButtons();save()});
  document.querySelector(".app").appendChild(b)}
function updateTip(){let t="";
  if(S.moves===0){if(S.stats.taps<3)t="Тапайте по курице: каждый тап ускоряет её";
  else if(S.lifetime<5&&!S.nests.some(n=>n.eggs))t="Скоро появятся яйца. Тапните по гнезду, чтобы собрать их";
  else if(S.lifetime<5)t="Тапните по гнезду с яйцами, чтобы собрать их";
  else if(S.stats.bought<1)t="Купите вторую курицу во вкладке «Птицы»";
  else if(!S.up.slot&&S.nests.length>=3)t="Все гнёзда заняты. Откройте новое гнездо за яйца";
  else if(!S.stats.hatched&&S.eggs>=incubCost())t="Попробуйте инкубатор: из него вылупляются редкие птицы";}
  const el=$("tip");if(el.textContent!==t)el.textContent=t;el.hidden=!t}
function refreshButtons(){
  document.querySelectorAll(".buy[data-t]").forEach(b=>{const t=T[b.dataset.t];if(!known(t))return;b.disabled=S.eggs<birdCost(t)});
  document.querySelectorAll(".buy[data-u]").forEach(b=>{const u=UPS.find(x=>x.id===b.dataset.u),l=S.up[u.id];b.disabled=l>=u.max||S.eggs<u.cost(l)});
  const inc=$("incStart");if(inc)inc.disabled=!S.incub.free&&S.eggs<incubCost();
  $("collectAll").disabled=!S.nests.some(n=>n.eggs);
  const c=claimable()+(dailyState().can?1:0);const bq=$("b-quests");bq.hidden=!c;bq.textContent=c;
  $("b-birds").hidden=S.incub.state!=="ready";
}
function renderTop(){$("eggs").textContent=fmt(S.eggs);$("rate").textContent=fmt(perMin())+" яиц/мин";$("boostPill").innerHTML=boosted()?'<span class="boost-pill">×2</span>':"";$("sound").textContent=S.sound?"🔈":"🔇"}

// ---------- fx / modal ----------
function fxAt(i,txt,gold){const el=$("nest-"+i);if(!el)return;const r=el.getBoundingClientRect();const f=document.createElement("div");f.className="fx"+(gold?" gold":"");f.textContent=txt;f.style.left=(r.left+r.width/2-24)+"px";f.style.top=(r.top+10)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
let toastT;function toast(m){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
const mq=[];
function modal(html,btn,onClose){mq.push([html,btn,onClose]);if(mq.length===1)showModal()}
function showModal(){const [html,btn,onClose]=mq[0];$("modalRoot").innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="sheet">${html}<button class="big-btn" id="modalOk">${btn}</button></div></div>`;const ok=$("modalOk");ok.focus();ok.onclick=()=>{$("modalRoot").innerHTML="";mq.shift();onClose&&onClose();if(mq.length)showModal()}}
function flyEggs(i,count,gold){const el=$("nest-"+i),c=$("counter");if(!el||!c)return;const a=el.getBoundingClientRect(),b=c.getBoundingClientRect();
  for(let k=0;k<count;k++){const f=document.createElement("div");f.className="fly";f.innerHTML=`<svg viewBox="0 0 30 36" width="20" height="24"><ellipse cx="15" cy="20" rx="12" ry="15" fill="${gold?"#ffc83a":"#fff8ea"}" stroke="#2b1d14" stroke-width="3"/></svg>`;
    const x0=a.left+a.width*(.3+.2*k),y0=a.top+a.height*.7,x1=b.left+20,y1=b.top+10;f.style.left=x0+"px";f.style.top=y0+"px";document.body.appendChild(f);
    if(!f.animate){f.remove();continue}
    const anim=f.animate([{transform:"translate(0,0) scale(1)"},{transform:`translate(${(x1-x0)/2}px,${(y1-y0)/2-60}px) scale(1.3)`},{transform:`translate(${x1-x0}px,${y1-y0}px) scale(.6)`}],{duration:550+k*80,easing:"ease-in"});
    anim.onfinish=()=>{f.remove();c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}}}

// ---------- actions ----------
let lastTap=0;
$("grid").addEventListener("pointerup",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;lastTap=performance.now();nestTap(e)});
$("grid").addEventListener("click",e=>{if(performance.now()-lastTap<700)return;nestTap(e)});
function nestTap(e){
  const el=(e.target.closest&&e.target.closest(".nest"))||document.elementFromPoint(e.clientX,e.clientY)?.closest(".nest");if(!el)return;
  if(el.dataset.buy){$("t-birds").click();return}
  if(el.dataset.slot){buyUp("slot");return}
  const i=+el.dataset.i,n=S.nests[i];
  el.classList.remove("squash");void el.offsetWidth;el.classList.add("squash");setTimeout(()=>el.classList.remove("squash"),300);
  S.stats.taps++;
  if(n.eggs){collect(i)}else{n.prog=Math.min(.999,n.prog+0.15);pop(360,.07,"square")}
  updateGrid();renderTop();refreshButtons();save();
}
$("collectAll").addEventListener("click",()=>{let sum=0,g=false;S.nests.forEach((n,i)=>{if(n.eggs){g=g||(n.gold||[]).slice(0,n.eggs).some(Boolean);sum+=collect(i,true)}});if(sum){pop(g?880:700,.15);toast(`Собрано ${fmt(sum)} яиц${g?", есть золотые!":""}`)}updateGrid();renderTop();refreshButtons();save()});
$("v-birds").addEventListener("click",e=>{
  if(e.target.closest("#incStart")){const I=S.incub;if(I.free)I.free--;else{const c=incubCost();if(S.eggs<c)return;S.eggs-=c}I.state="busy";I.left=HATCH_TIME;pop(420,.1);renderIncub();renderTop();refreshButtons();save();return}
  if(e.target.closest("#incOpen")){hatch();return}
  const b=e.target.closest(".buy[data-t]");if(!b||b.disabled)return;const t=T[b.dataset.t],c=birdCost(t);if(S.eggs<c)return;
  S.eggs-=c;S.owned[t.id]=(S.owned[t.id]||0)+1;S.stats.bought++;
  const res=placeBird(t.id);
  toast(res==="new"?`${t.name} заселилась в гнездо`:res.startsWith("replaced")?`${t.name} заменила птицу «${res.split(":")[1]}»`:`${t.name} ушла на соседний двор: здесь птицы сильнее`);
  pop(760,.12);renderGrid();renderShop();renderTop();save();
});
function hatch(){
  const roll=Math.random()*100;let pool,r;
  if(roll<ODDS.epic){pool=RARES.filter(t=>t.rare==="epic");r="epic"}
  else if(roll<ODDS.epic+ODDS.rare){pool=RARES.filter(t=>t.rare==="rare");r="rare"}
  else{pool=SHOP.filter(known);r="common"}
  const t=pool[Math.floor(Math.random()*pool.length)];
  S.incub.state="idle";S.incub.left=0;S.stats.hatched++;if(r!=="common")S.stats.rare++;
  S.owned[t.id]=(S.owned[t.id]||0)+1;S.quests["seen_"+t.id]=1;
  const res=placeBird(t.id);
  const where=res==="new"?"Птица заселилась в свободное гнездо.":res.startsWith("replaced")?`Птица заменила самую слабую: «${res.split(":")[1]}».`:"Во дворе нет места для неё, но она есть в вашей коллекции.";
  const bonus=res==="kept"?Math.floor(baseMin()*2):0;if(bonus){earn(bonus)}
  r==="common"?pop(700,.15):fanfare();
  modal(`<div class="hero ${r!=="common"?"rays":""}">${birdSVG(t)}</div><h3>${t.name}${r!=="common"?`<span class="tag ${r}">${RLABEL[r]}</span>`:""}</h3><p>${t.value} ${t.value===1?"яйцо":"яиц"} каждые ${t.time} с. ${where}${bonus?` Утешительный приз: ${fmt(bonus)} яиц.`:""}</p>`,"Ура!",()=>{renderGrid();renderShop();renderTop();refreshButtons()});
  save();
}
$("v-quests").addEventListener("click",e=>{
  if(e.target.closest("#dailyClaim")){const d=dailyState();if(!d.can)return;const v=dailyReward(d.day);earn(v);S.daily.streak=(S.daily.last===yesterdayKey()?S.daily.streak:0)+1;S.daily.last=dayKey();if(d.day===6)S.incub.free++;fanfare();toast(`+${fmt(v)} яиц${d.day===6?" и бесплатное яйцо для инкубатора":""}`);renderQuests();renderTop();refreshButtons();save();return}
  const b=e.target.closest(".buy[data-q]");if(!b||b.disabled)return;const q=Q.find(x=>x.id===b.dataset.q);if(q.p()<q.n)return;
  S.quests[q.id]=1;earn(q.r);pop(880,.15);toast(`Задание выполнено: +${fmt(q.r)} яиц`);renderQuests();renderTop();refreshButtons();save();
});
function buyUp(id){const u=UPS.find(x=>x.id===id),l=S.up[id];if(l>=u.max||S.eggs<u.cost(l)){if(id==="slot")toast(`Нужно ${fmt(u.cost(l))} яиц`);return}S.eggs-=u.cost(l);S.up[id]++;pop(760,.12);renderUps();renderGrid();renderTop();save()}
$("ups").addEventListener("click",e=>{
  const mv=e.target.closest("#moveBtn");if(mv){if(mv.disabled)return;if(!mv.dataset.sure){mv.dataset.sure="1";mv.textContent="Точно?";return}
    const g=gloryGain(),keep={glory:S.glory+g,moves:S.moves+1,lifetime:S.lifetime,sound:S.sound,daily:S.daily,quests:S.quests,stats:S.stats,incub:{state:"idle",left:0,result:null,free:S.incub.free}};
    S=Object.assign(fresh(),keep);save();renderAll();$("t-yard").click();fanfare();
    modal(`<div class="hero rays">${birdSVG(T.hen)}</div><h3>Новая ферма!</h3><p>Вы получили ${g} 🪶. Теперь все яйца приносят +${S.glory*10}% навсегда.</p>`,"Начать");return}
  if(e.target.closest("#boostBtn")){if(boosted())return;S.boostUntil=now()+5*60000;pop(600,.2);toast("Ускорение ×2 на 5 минут");renderUps();renderTop();save();return}
  const b=e.target.closest(".buy[data-u]");if(b&&!b.disabled)buyUp(b.dataset.u)});
$("reset").addEventListener("click",e=>{const b=e.target;if(b.dataset.sure){S=fresh();try{localStorage.removeItem("ptichiy-dvor")}catch(_){}b.dataset.sure="";b.textContent="Начать заново";renderAll();toast("Двор начат заново");return}b.dataset.sure="1";b.textContent="Точно? Нажмите ещё раз"});
$("sound").addEventListener("click",()=>{S.sound=!S.sound;renderTop();pop()});
document.querySelectorAll(".tabs button").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!==t.dataset.v);
  ({"v-birds":renderShop,"v-up":renderUps,"v-yard":renderGrid,"v-quests":renderQuests})[t.dataset.v]();refreshButtons();
}));

function save(){S.t=now();try{localStorage.setItem("ptichiy-dvor",JSON.stringify(S))}catch(e){}}
function renderAll(){renderGrid();renderShop();renderQuests();renderUps();renderTop();refreshButtons()}
let last=performance.now(),wasBoost=boosted(),lastClaim=-1,lastInc=S.incub.state;
setInterval(()=>{const t=performance.now();tick(Math.min((t-last)/1000,1));last=t;updateGrid();renderTop();refreshButtons();
  if(!$("v-birds").hidden){if(S.incub.state!==lastInc)renderIncub();else if(S.incub.state==="busy"){const l=$("incLeft"),b=$("incBar");if(l)l.textContent=Math.ceil(S.incub.left);if(b)b.style.width=(1-S.incub.left/HATCH_TIME)*100+"%"}}
  if(S.incub.state!==lastInc&&S.incub.state==="ready")toast("Яйцо в инкубаторе готово!");lastInc=S.incub.state;
  if(!$("v-quests").hidden){const c=claimable();if(c!==lastClaim){lastClaim=c;renderQuests()}}
  if(wasBoost!==boosted()){wasBoost=boosted();if(!$("v-up").hidden)renderUps()}
},200);
setInterval(save,3000);
setInterval(()=>{updateTip();if(!document.hidden&&!$("v-yard").hidden&&!mq.length&&S.lifetime>30){S.storkT-=1;if(S.storkT<=0){S.storkT=60+Math.random()*60;spawnStork()}}},1000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
renderAll();
// daily popup on open
if(OFF.away>60&&(OFF.got>0||OFF.waiting>0)){const m=Math.floor(Math.min(OFF.away,10800)/60);
  modal(`<div class="hero">${birdSVG(T[S.nests[S.nests.length-1].type])}</div><h3>С возвращением!</h3><p>Пока вас не было ${m>=60?Math.floor(m/60)+" ч "+(m%60)+" мин":m+" мин"}${OFF.away>10800?" (птицы несутся без вас до 3 часов)":""}:</p><p>${OFF.got>0?"корзинщик собрал "+fmt(OFF.got)+" яиц, ":""}в гнёздах ждут ${fmt(OFF.waiting)} яиц.</p>`,"К птицам")}
updateTip();
(()=>{const d=dailyState();if(!d.can)return;modal(`<div class="hero">${bigEgg("busy")}</div><h3>Награда дня ${d.day+1}/7</h3><p>${d.reset?"Серия прервалась, начинаем заново. ":""}Сегодня: ${fmt(dailyReward(d.day))} яиц${d.day===6?" и бесплатное яйцо для инкубатора":""}.</p>`,"Забрать",()=>{$("t-quests").click();const b=$("dailyClaim");b&&b.click()})})();
</script>

<script>
// ---------- Telegram Mini App ----------
(function(){
  const tg=window.Telegram&&Telegram.WebApp; if(!tg||!tg.initData) return;
  tg.ready(); tg.expand();
  try{tg.disableVerticalSwipes()}catch(e){}
  try{tg.setHeaderColor("#8fd0f0");tg.setBackgroundColor("#8fd0f0")}catch(e){}
  // haptics on collect
  const _collect=collect;
  collect=function(i,silent){const v=_collect(i,silent);if(v&&!silent){try{tg.HapticFeedback.impactOccurred("light")}catch(e){}}return v};
  // cloud save (Telegram CloudStorage, synced across the player's devices)
  let lastCloud=0;
  function cloudSave(force){if(!force&&performance.now()-lastCloud<10000)return;lastCloud=performance.now();
    try{const j=JSON.stringify(S);if(j.length<4000)tg.CloudStorage.setItem("dvor",j)}catch(e){}}
  const _save=save; save=function(){_save();cloudSave(false)};
  document.addEventListener("visibilitychange",()=>{if(document.hidden)cloudSave(true)});
  try{tg.onEvent("viewportChanged",()=>{})}catch(e){}
  tg.CloudStorage.getItem("dvor",(err,v)=>{
    if(err||!v)return;
    try{const c=JSON.parse(v);if(!c||!c.nests||c.t<=S.t)return;
      const f=fresh();S=Object.assign(f,c);S.up=Object.assign(f.up,c.up||{});S.stats=Object.assign(f.stats,c.stats||{});S.daily=Object.assign(f.daily,c.daily||{});S.incub=Object.assign(f.incub,c.incub||{});S.quests=c.quests||{};
      renderAll();toast("Прогресс загружен из Telegram");
    }catch(e){}
  });
})();
</script>
